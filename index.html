  <meta name="robots" content="index,follow">

  <meta property="og:type" content="website">
  <meta property="og:title" content="CERI | Centre d'Entrenament i Rehabilitació Individualitzat">

  <link rel="canonical" href="https://www.ceritorroellademontgri.com/">

  <style>
    :root{
      --bg:#070a12;
      --panel:rgba(255,255,255,.05);
      --panel-soft:rgba(255,255,255,.035);
      --line:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.95);
      --muted:rgba(255,255,255,.72);
      --accent:#f2c14e;
      --max:1100px;
      --r:18px;
      --shadow: 0 16px 45px rgba(0,0,0,.38);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(900px 520px at 20% 10%, rgba(242,193,78,.12), transparent 60%),
        radial-gradient(760px 520px at 80% 15%, rgba(92,200,255,.10), transparent 55%),
        linear-gradient(180deg,#050813,var(--bg));
      color:var(--text);
      line-height:1.6;
    }

    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 20px}

    header{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(5,8,19,.70);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 0;
      gap:16px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:900;
      min-width: 260px;
    }

    .logo{
      width:56px;
      height:auto;
      display:block;
    }

    .menu{
      display:flex;
      gap:16px;
      font-weight:800;
      font-size:14px;
      flex-wrap:wrap;
    }

    .menu a{color:var(--muted)}
    .menu a:hover{color:var(--text)}

    .btn{
      padding:10px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      font-weight:900;
      background:rgba(255,255,255,.04);
    }

    .btn.primary{
      background:linear-gradient(135deg,#f2c14e,#f2c14eaa);
      color:#1b1406;
    }

    section{padding:60px 0}

    .hero{
      background:
        linear-gradient(rgba(5,8,19,.62),rgba(5,8,19,.82)),
        url("hero-ceri.jpg");
      background-size:cover;
      background-position:center;
    }

    h1{
      font-size:clamp(36px,5vw,56px);
      margin:0 0 14px;
    }

    .subtitle{
      max-width:680px;
      color:var(--muted);
    }

    .grid2{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:24px;
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:var(--r);
      padding:24px;
    }

    .menu a{color:var(--muted)}
    .menu a:hover{color:var(--text)}
  </style>
</head>

<body>

<header>
  <div class="wrap nav">

    <div class="brand">
      <img src="./logo-ceri.jpg" class="logo" alt="Logo CERI">
      <div>
        <div style="font-weight:950;">CERI</div>
        <small style="color:rgba(255,255,255,.7)">Centre d'Entrenament i Rehabilitació Individualitzat</small>
      </div>
    </div>

    <nav class="menu">
      <a href="#que-es">Què és</a>
      <a href="#serveis">Serveis</a>
      <a href="fisioterapia.html">Fisioteràpia</a>
      <a href="#contacte">Contacte</a>
    </nav>

    <a class="btn primary" href="https://wa.me/34640562440">Contacta</a>

  </div>
</header>

<main>

  <section class="hero">
    <div class="wrap">
      <h1>CERI</h1>
      <p class="subtitle">
        Entrenament, rehabilitació i salut amb criteri professional.
      </p>
    </div>
  </section>

</main>

</body>
</html>
